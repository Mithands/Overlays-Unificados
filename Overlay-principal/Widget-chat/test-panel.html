<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Test Panel - Cyberpunk Chat Widget</title>
    <link rel="icon" type="image/png" href="img/netrunner.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Reusa los estilos del widget principal -->
    <link rel="stylesheet" href="css/bundle.css" />
    <style>
      /* =========================================
       TEST PANEL STYLE
       ========================================= */
      body {
        background: url("img/fondo_pruebas2.png") no-repeat center center fixed;
        background-size: cover;
        padding: 20px;
      }

      #test-panel {
        position: fixed;
        right: 20px;
        top: 20px;
        width: 280px;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        background: rgba(10, 10, 18, 0.95);
        border: 1px solid rgba(0, 246, 255, 0.3);
        border-left: 3px solid #00f6ff;
        padding: 15px;
        font-family: "Rajdhani", sans-serif;
        color: #fff;
        z-index: 1000;
      }

      /* Custom Scrollbar for Test Panel */
      #test-panel::-webkit-scrollbar {
        width: 4px;
      }

      #test-panel::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.3);
      }

      #test-panel::-webkit-scrollbar-thumb {
        background: #00f6ff;
        border-radius: 2px;
      }

      #test-panel::-webkit-scrollbar-thumb:hover {
        background: #00d8e0;
      }

      .panel-title {
        margin: 0 0 15px;
        color: #00f6ff;
        font-size: 14px;
        letter-spacing: 2px;
      }

      .panel-section {
        margin-bottom: 15px;
      }

      .panel-label {
        display: block;
        font-size: 11px;
        color: #888;
        margin-bottom: 5px;
      }

      .panel-label--cyan {
        color: #00f6ff;
      }

      .panel-label--red {
        color: #ff3a3a;
      }

      .panel-input {
        width: 100%;
        padding: 8px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(0, 246, 255, 0.3);
        color: #fff;
        font-family: inherit;
        font-size: 12px;
      }

      .panel-input--gold {
        border-color: rgba(255, 215, 0, 0.3);
        color: #ffd700;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: #00f6ff;
        margin-bottom: 10px;
        cursor: pointer;
      }

      .section-label {
        font-size: 11px;
        color: #888;
        margin-bottom: 8px;
      }

      .button-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 300px;
        overflow-y: auto;
        padding-right: 5px;
        margin-bottom: 15px;
      }

      .button-row {
        display: flex;
        gap: 8px;
      }

      /* Base button styles */
      .btn {
        padding: 6px 10px;
        cursor: pointer;
        font-family: inherit;
        font-size: 10px;
        text-align: left;
        border: 1px solid;
      }

      .btn--admin {
        background: rgba(255, 0, 60, 0.2);
        border-color: #ff003c;
        color: #ff003c;
      }

      .btn--top1 {
        background: rgba(0, 246, 255, 0.2);
        border-color: #00f6ff;
        color: #00f6ff;
      }

      .btn--top {
        background: rgba(255, 215, 0, 0.15);
        border-color: #ffd700;
        color: #ffd700;
      }

      .btn--normal {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.4);
        color: #fff;
      }

      .btn--dim {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.2);
        color: #888;
      }

      .btn--cyan {
        background: rgba(0, 246, 255, 0.2);
        border-color: #00f6ff;
        color: #00f6ff;
        padding: 8px 15px;
        font-size: 11px;
      }

      .btn--gold {
        background: rgba(255, 215, 0, 0.15);
        border-color: #ffd700;
        color: #ffd700;
        padding: 8px 15px;
        font-size: 11px;
      }

      .btn--full {
        width: 100%;
        padding: 6px;
      }

      .btn--green {
        background: rgba(0, 255, 0, 0.1);
        border-color: #00ff00;
        color: #00ff00;
      }

      .btn--red {
        background: rgba(255, 0, 0, 0.2);
        border-color: #ff0000;
        color: #ff0000;
      }

      .btn--purple {
        background: rgba(191, 0, 255, 0.1);
        border-color: #bf00ff;
        color: #bf00ff;
      }

      .btn--orange {
        background: rgba(255, 128, 0, 0.15);
        border-color: #ff8000;
        color: #ff8000;
        box-shadow: 0 0 8px rgba(255, 128, 0, 0.2);
      }

      .btn--orange:hover {
        background: #ff8000;
        color: #000;
        box-shadow: 0 0 15px rgba(255, 128, 0, 0.5);
      }

      .panel-label--orange {
        color: #ff8000;
        text-shadow: 0 0 8px rgba(255, 128, 0, 0.4);
      }

      .divider {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(0, 246, 255, 0.2);
      }

      .divider--red {
        border-color: rgba(255, 58, 58, 0.3);
      }

      .panel-footer {
        margin-top: 10px;
        font-size: 9px;
        color: #555;
        text-align: center;
      }

      /* Widget iframe container - Dynamic Full Screen Preview */
      .widget-container {
        position: fixed;
        left: 20px;
        top: 20px;
        /* Occupy space up to the right panel (280px + 20px right margin + 20px gap) */
        width: calc(100% - 340px);
        /* Maintain 16:9 Aspect Ratio */
        aspect-ratio: 16/9;
        /* Ensure it doesn't overflow vertically on small screens */
        max-height: calc(100vh - 40px);
        border: 1px solid rgba(0, 246, 255, 0.2);
        border-radius: 4px;
        overflow: hidden;
        background: transparent;
        z-index: 500;
        /* Centered vertically if aspect ratio forces it smaller than height */
        margin: auto;
      }

      .widget-container iframe {
        width: 1920px;
        height: 1080px;
        border: none;
        /* Transformation will be handled by JS */
        transform-origin: 0 0;
        pointer-events: auto;
      }

      .widget-label {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 12px;
        color: #00f6ff;
        background: rgba(0, 0, 0, 0.7);
        padding: 2px 6px;
        border-radius: 2px;
        font-family: "Share Tech Mono", monospace;
        letter-spacing: 1px;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <!-- Widget Preview (embedded iframe) -->
    <div class="widget-container" id="preview-container">
      <span class="widget-label">1080p PREVIEW</span>
      <iframe id="widget-frame" src="index.html"></iframe>
    </div>

    <!-- Test Panel -->
    <div id="test-panel">
      <h3 class="panel-title">🎮 PANEL DE PRUEBAS</h3>

      <div class="panel-section">
        <label class="checkbox-label">
          <input type="checkbox" id="keep-visible-checkbox" />
          MANTENER WIDGET VISIBLE
        </label>
      </div>

      <div class="panel-section">
        <label class="panel-label panel-label--cyan">CAMBIAR FONDO:</label>
        <select
          id="bg-switcher"
          class="panel-input"
          onchange="changeBackground(this.value)"
        >
          <option value="img/fondo_pruebas2.png">Fondo Cyberpunk (PNG)</option>
          <option value="img/fondo_pruebas.webp">Fondo Pruebas (WebP)</option>
          <option value="#0a0a12">Color Sólido (Oscuro)</option>
        </select>
      </div>

      <div class="panel-section">
        <label class="panel-label panel-label--yellow"
          >CATEGORÍA (JUEGO):</label
        >
        <select
          id="category-switcher"
          class="panel-input"
          onchange="setCategory(this.value)"
        >
          <option value="Just Chatting">Just Chatting</option>
          <option value="Nightingale">Nightingale</option>
          <option value="Cyberpunk 2077">Cyberpunk 2077</option>
          <option value="The Witcher 3: Wild Hunt">The Witcher 3</option>
          <option value="Rust">Rust</option>
          <option value="Apex Legends">Apex Legends</option>
          <option value="SCUM">SCUM</option>
          <option value="Star Wars Outlaws">Star Wars Outlaws</option>
          <option value="ARC Raiders">ARC Raiders</option>
          <option value="Minecraft">Minecraft</option>
        </select>
      </div>

      <div class="panel-section">
        <label class="panel-label panel-label--cyan">ESTADO DEL STREAM (SIMULACIÓN):</label>
        <select
          id="stream-status-switcher"
          class="panel-input"
        >
          <option value="online">🟢 Stream ONLINE (Suma XP y logros)</option>
          <option value="offline">🔴 Stream OFFLINE (Bloquea XP)</option>
          <option value="real">📡 Usar Estado Real de Twitch</option>
        </select>
      </div>

      <div class="panel-section">
        <label class="panel-label">MENSAJE:</label>
        <input
          type="text"
          id="test-message"
          value="Este es un mensaje de prueba!"
          class="panel-input"
        />
      </div>

      <div class="section-label">ADMIN & TOP 15:</div>

      <div class="button-list">
        <!-- ADMIN -->
        <button onclick="testUser('Mithands')" class="btn btn--admin">
          ⚡ ADMIN - Mithands
        </button>

        <!-- TEST USERS -->
        <button onclick="testUser('Test')" class="btn btn--cyan">
          ✨ Test
        </button>
        <button onclick="testUser('test2')" class="btn btn--cyan">
          ✨ test2
        </button>
        <button onclick="testUser('test3')" class="btn btn--cyan">
          ✨ test3
        </button>
        <button onclick="testUser('Playmithttv')" class="btn btn--cyan">
          ✨ Playmithttv
        </button>
        <button onclick="testUser('ractor09')" class="btn btn--cyan">
          ✨ Ractor09
        </button>
      </div>

      <div class="section-label">OTROS:</div>
      <div class="button-list">
        <button onclick="testUser('kasten-play')" class="btn btn--normal">
          # TOP 241 - kasten-play
        </button>
        <button onclick="testUser('UsuarioNuevo')" class="btn btn--dim">
          Sin ranking - UsuarioNuevo
        </button>
      </div>

      <div class="divider">
        <label class="panel-label">USUARIO PERSONALIZADO:</label>
        <div class="button-row">
          <input
            type="text"
            id="custom-user"
            placeholder="Nombre..."
            class="panel-input"
            style="flex: 1"
          />
          <button
            onclick="testUser(document.getElementById('custom-user').value)"
            class="btn btn--cyan"
          >
            TEST
          </button>
        </div>
      </div>

      <div class="divider">
        <label class="panel-label">RACHAS (STREAK):</label>
        <div class="button-row">
          <input
            type="number"
            id="streak-days"
            placeholder="Días..."
            value="5"
            min="1"
            class="panel-input panel-input--gold"
            style="flex: 1"
          />
          <button
            onclick="testStreak(document.getElementById('streak-days').value)"
            class="btn btn--gold"
          >
            SET & TEST
          </button>
        </div>
      </div>

      <!-- FIRST HACK CONTROLS -->
      <div class="divider">
        <label class="panel-label panel-label--orange">⚡ FIRST HACK (x2 XP + LOGRO):</label>
        <div class="button-row">
          <button
            onclick="testFirstHack('FirstHacker')"
            class="btn btn--orange"
            style="flex: 1"
          >
            ⚡ PROBAR FIRST HACK
          </button>
          <button
            onclick="resetFirstHackSession()"
            class="btn btn--dim"
            title="Permite que el siguiente mensaje en stream activo vuelva a ser First Hack"
          >
            🔄 RESET
          </button>
        </div>
      </div>

      <!-- ACHIEVEMENTS-VIEW STANDALONE CONTROLS -->
      <div class="divider">
        <label class="panel-label panel-label--gold">🏆 ACHIEVEMENTS-VIEW (OVERLAY INDEPENDIENTE):</label>
        <div class="button-row" style="margin-bottom: 6px;">
          <a
            href="Achievements-view.html"
            target="_blank"
            class="btn btn--cyan"
            style="flex: 1; text-align: center; text-decoration: none; line-height: 2;"
          >
            🌐 ABRIR ACHIEVEMENTS-VIEW
          </a>
        </div>
        <div class="button-row">
          <button
            onclick="testDirectAchievement('First Hack', 'rare', 'img/logros/first_hack.png', '¡Primer mensaje!')"
            class="btn btn--orange"
            style="flex: 1"
          >
            ⚡ FIRST HACK
          </button>
          <button
            onclick="testDirectAchievement('Night City Merc', 'epic', 'img/logros/netrunner.png', 'Leyenda urbana')"
            class="btn btn--purple"
            style="flex: 1"
          >
            🟣 ÉPICO
          </button>
          <button
            onclick="testDirectAchievement('Arasaka Legend', 'legendary', 'img/logros/arasaka.png', 'Poder absoluto')"
            class="btn btn--gold"
            style="flex: 1"
          >
            👑 LEGENDARIO
          </button>
        </div>
      </div>

      <!-- DATA CONTROLS -->
      <div class="divider divider--red">
        <label class="panel-label panel-label--red">DATA CONTROLS:</label>
        <div class="button-row">
          <button
            onclick="callWidgetFunction('exportXPData')"
            class="btn btn--full btn--green"
            style="flex: 1"
          >
            EXPORT LOCAL
          </button>
        </div>
        <div style="margin-top: 8px">
          <button
            onclick="callWidgetFunction('testGistConnection')"
            class="btn btn--full btn--top1"
          >
            📡 TEST GIST CONNECTION
          </button>
        </div>
        <div style="margin-top: 8px">
          <button
            onclick="callWidgetFunction('testAchievement')"
            class="btn btn--full btn--top"
          >
            🏆 TEST ACHIEVEMENT
          </button>
        </div>
        <div style="margin-top: 8px">
          <button onclick="testLevelUp()" class="btn btn--full btn--purple">
            🚀 TEST LEVEL UP (NUEVO)
          </button>
        </div>
      </div>

      <!-- IDLE STATS & EMOTES CONTROLS -->
      <div class="divider">
        <label class="panel-label panel-label--cyan">STATS & EMOTES:</label>
        <div class="button-row">
          <button
            onclick="callWidgetFunction('testIdleMode')"
            class="btn btn--full btn--top1"
            style="flex: 1"
          >
            📊 TEST IDLE STATS
          </button>
          <button
            onclick="callWidgetFunction('showEmoteStats')"
            class="btn btn--full btn--purple"
            style="flex: 1"
          >
            🎭 EMOTE STATS
          </button>
        </div>
        <div style="margin-top: 8px">
          <button
            onclick="callWidgetFunction('testEmoteMessage')"
            class="btn btn--full btn--green"
          >
            ✨ TEST 7TV/BTTV MESSAGE
          </button>
        </div>
      </div>

      <div class="panel-footer">Pulsa un botón para simular un mensaje</div>
    </div>

    <script>
      /**
       * Test Panel - Script de Control
       * Comunica con el widget via postMessage o acceso directo al iframe
       */

      // Referencia al iframe del widget
      const widgetFrame = document.getElementById("widget-frame");
      const previewContainer = document.getElementById("preview-container");

      // AUTO-SCALE FUNCTION
      function fitPreview() {
        if (!widgetFrame || !previewContainer) return;
        const containerWidth = previewContainer.getBoundingClientRect().width;
        const scale = containerWidth / 1920;
        widgetFrame.style.transform = `scale(${scale})`;
        console.log(
          `🖥️ Preview rescaled: ${Math.round(containerWidth)}px width (Scale: ${scale.toFixed(3)})`,
        );
      }

      window.addEventListener("load", fitPreview);
      window.addEventListener("resize", fitPreview);

      function changeBackground(bgPath) {
        if (bgPath.startsWith("img/")) {
          document.body.style.background = `url('${bgPath}') no-repeat center center fixed`;
          document.body.style.backgroundSize = "cover";
        } else {
          document.body.style.background = bgPath;
        }
        console.log(`🖼️ Background changed to: ${bgPath}`);
      }

      widgetFrame.addEventListener("load", () => {
        console.log("✅ Widget iframe loaded");
        fitPreview();
      });

      function getWidgetWindow() {
        return widgetFrame.contentWindow;
      }

      // --- REAL TIME TWITCH API CHECKER ---

      async function checkSubStatus(channel, username) {
        try {
          // Normalizar entrada
          const cleanChannel = channel.replace("#", "").trim();
          const cleanUser = username.trim();

          // Usamos IVR API (alternativa robusta a DecAPI) que devuelve JSON
          // Endpoint: https://api.ivr.fi/v2/twitch/subage/{user}/{channel}
          const url = `https://api.ivr.fi/v2/twitch/subage/${cleanUser}/${cleanChannel}`;
          console.log(`📡 GET ${url}`);

          const response = await fetch(url);

          if (response.status === 404) {
            // Usuario o canal no existen
            return 0;
          }

          if (!response.ok) {
            console.warn(
              `⚠️ API Error ${response.status}:`,
              response.statusText,
            );
            return 0;
          }

          const data = await response.json();
          console.log(`📥 API Response for ${cleanUser}:`, data);

          // IVR API devuelve un objeto JSON claro
          // { subscribed: boolean, cumulative: { months: number } }

          if (data.subscribed === true) {
            const months = data.cumulative ? data.cumulative.months : 0;
            // Si está suscrito pero retorna 0 meses (recién sub), devolvemos al menos 1
            return months > 0 ? months : 1;
          }

          return 0;
        } catch (e) {
          console.warn("⚠️ Error consultando API de subs (IVR):", e);
          return 0;
        }
      }

      // Simular mensaje con DATOS REALES
      async function testUser(username) {
        const message =
          document.getElementById("test-message").value || "Mensaje de prueba";
        const win = getWidgetWindow();

        if (!win || !win.simularMensaje) {
          console.log("Esperando a que cargue el widget...");
          return;
        }

        // Intentar obtener el canal configurado en el widget
        let channel = "mithands"; // Fallback
        if (win.APP_INSTANCE && win.APP_INSTANCE.config) {
          channel = win.APP_INSTANCE.config.TWITCH_CHANNEL;
        }

        console.log(
          `🔍 Consultando estado real de ${username} en el canal ${channel}...`,
        );

        // Feedback visual temporal en el botón (opcional, pero buena UX)
        // Como no tenemos referencia al botón presionado fácil, usamos log

        const realMonths = await checkSubStatus(channel, username);
        const extraTags = {};

        // Leer modo de simulación de stream
        const streamStatusSelector = document.getElementById("stream-status-switcher");
        const streamMode = streamStatusSelector ? streamStatusSelector.value : "online";
        if (streamMode === "online") {
          extraTags.isStreamLive = true;
        } else if (streamMode === "offline") {
          extraTags.isStreamLive = false;
        }
        // Si es "real", no inyectamos isStreamLive para que el widget use su consulta real a Twitch

        if (realMonths > 0) {
          console.log(
            `✅ ¡CONFIRMADO! ${username} es suscriptor (${realMonths} meses)`,
          );
          extraTags.subscriber = true;
          extraTags["badge-info"] = { subscriber: realMonths.toString() };
        } else {
          console.log(`👤 ${username} no parece estar suscrito (o API error)`);
        }

        // ESPECIAL: Solo los usuarios de prueba 'test', 'test2', 'test3' y 'playmithttv' detectan la categoría del selector
        const specialTestUsers = ["test", "test2", "test3", "playmithttv"];
        if (specialTestUsers.includes(username.toLowerCase())) {
          const categorySelector = document.getElementById("category-switcher");
          if (categorySelector) {
            extraTags.category = categorySelector.value;
            console.log(
              `✨ Usuario ${username}: Forzando categoría ${extraTags.category} en el mensaje`,
            );
          }

          // SIMULACIÓN SUSCRIPTOR: Solo para test3
          if (username.toLowerCase() === "test3") {
            extraTags.subscriber = true;
            // Si no tiene meses reales, le ponemos 1 por defecto para que aparezca el badge
            if (
              !extraTags["badge-info"] ||
              !extraTags["badge-info"].subscriber
            ) {
              extraTags["badge-info"] = extraTags["badge-info"] || {};
              extraTags["badge-info"].subscriber = "1";
            }
            console.log(
              `✨ Usuario ${username}: Simulando estado de SUSCRIPTOR en Test Panel`,
            );
          }
        }

        win.simularMensaje(username, message, extraTags);
      }

      // Test streak
      function testStreak(days) {
        const win = getWidgetWindow();

        if (!win || !win.getXPStats) {
          console.error("Widget XP System not ready");
          return;
        }

        const streamStatusSelector = document.getElementById("stream-status-switcher");
        const streamMode = streamStatusSelector ? streamStatusSelector.value : "online";
        const extra = {};
        if (streamMode === "online") extra.isStreamLive = true;
        if (streamMode === "offline") extra.isStreamLive = false;

        if (win.setTestStreak) {
          win.setTestStreak("StreakTester", parseInt(days));
          win.simularMensaje("StreakTester", `Testing streak: ${days} days!`, extra);
        } else {
          console.log("setTestStreak not available in widget");
        }
      }

      // Test First Hack
      function testFirstHack(username = 'FirstHacker') {
        const win = getWidgetWindow();
        if (!win || !win.simularMensaje) {
          console.error("Widget not ready");
          return;
        }

        const msgInput = document.getElementById("custom-message");
        const message = (msgInput && msgInput.value.trim()) || "¡Primer mensaje del directo! 🚀⚡";

        win.simularMensaje(username, message, {
          isStreamLive: true,
          isFirstHack: true
        });
      }

      // Reset First Hack
      function resetFirstHackSession() {
        const win = getWidgetWindow();
        if (win) {
          if (win.resetFirstHack) {
            win.resetFirstHack();
          }
          console.log("⚡ First Hack de la sesión reseteado");
          alert("⚡ First Hack reseteado: el siguiente mensaje en stream activo volverá a ser el Primero del directo.");
        }
      }

      // Test Directo hacia Achievements-view.html
      function testDirectAchievement(name, rarity, image, description) {
        const userSelector = document.getElementById("test-user");
        const username = (userSelector && userSelector.value) || "Playmithttv";

        const payload = {
          username: username,
          achievement: {
            id: name.toLowerCase().replace(/\s+/g, '_'),
            name: name,
            description: description,
            condition: "Desbloqueo de prueba",
            category: "stream",
            rarity: rarity,
            image: image
          },
          timestamp: Date.now()
        };

        // 1. Enviar vía BroadcastChannel
        try {
          if (typeof BroadcastChannel !== "undefined") {
            const channel = new BroadcastChannel("mithands_achievements_channel");
            channel.postMessage({ type: "achievement_unlocked", data: payload });
          }
        } catch (e) {
          console.warn("BroadcastChannel error:", e);
        }

        // 2. Enviar vía localStorage
        try {
          localStorage.setItem("mithands_latest_achievement", JSON.stringify(payload));
        } catch (e) {}

        // 3. Si el iframe del widget tiene el notificationManager, dispararlo también allí
        const win = getWidgetWindow();
        if (win && win.APP_INSTANCE && win.APP_INSTANCE.processor) {
          const achService = win.APP_INSTANCE.processor.services.achievements;
          if (achService) {
            achService.emitAchievementUnlocked(username, payload.achievement);
          }
        }

        console.log(`🏆 Logro de prueba enviado a todos los overlays: ${name} para ${username}`);
      }

      // Llamar función expuesta en el widget
      function callWidgetFunction(funcName) {
        const win = getWidgetWindow();

        if (win && typeof win[funcName] === "function") {
          win[funcName]();
        } else {
          console.warn(`Function ${funcName} not available in widget`);
        }
      }

      // Sincronizar checkbox "mantener visible"
      document
        .getElementById("keep-visible-checkbox")
        .addEventListener("change", function () {
          const win = getWidgetWindow();
          if (win) {
            win.KEEP_WIDGET_VISIBLE = this.checked;
            console.log("Keep Visible:", this.checked);
          }
        });

      // Test Level Up (Specific for Cyberpunk overlay)
      function testLevelUp() {
        const win = getWidgetWindow();
        if (win) {
          // Use postMessage for cross-origin safety (local files)
          win.postMessage(
            {
              type: "TEST_LEVEL_UP",
              username: "NetRunner_Test",
              level: Math.floor(Math.random() * 50) + 10,
              title: "LEGEND OF NIGHT CITY",
            },
            "*",
          );

          console.log("Triggered Level Up Animation via postMessage");
        } else {
          console.warn("Widget window not found");
        }
      }

      function setCategory(category) {
        // Ya no lo enviamos globalmente para que no afecte a otros usuarios en el test panel
        // si el usuario prefiere que solo 'test' lo detecte.
        /*
            const win = getWidgetWindow();
            if (win) {

                    type: 'SET_CATEGORY',
                    category: category
                }, '*');
                console.log(`🎮 TestPanel: Set category to ${category}`);
            }
            */
        console.log(
          `🎮 TestPanel: Categoría seleccionada para pruebas: ${category}`,
        );
      }
    </script>
