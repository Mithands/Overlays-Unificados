<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>Twitch Overlays Master Canvas 1920x1080 // Mithands Stream</title>
    <link rel="stylesheet" href="css/unified-canvas.css">
</head>
<body>

    <!-- MASTER LIENZO UNIFICADO (1920x1080) -->
    <div id="master-canvas">

        <!-- 1. Slot: Barra de Metas (Top-Left) -->
        <iframe id="slot-metas" class="widget-slot" src="Widget-meta/index.html" allow="autoplay" scrolling="no" frameborder="0"></iframe>

        <!-- 2. Slot: Feed de Últimos Seguidores (Bottom-Left) -->
        <iframe id="slot-seguidores" class="widget-slot" src="Widget-seguidores/index.html" allow="autoplay" scrolling="no" frameborder="0"></iframe>

        <!-- 3. Slot: Widget de Votaciones Interactivas (Center-Left) -->
        <iframe id="slot-votacion" class="widget-slot" src="Widget-votacion/index.html" allow="autoplay" scrolling="no" frameborder="0"></iframe>

        <!-- 4. Slot: Bot TTS / Audio Player (Top-Right) -->
        <iframe id="slot-tts" class="widget-slot" src="Bot-tts/overlay.html" allow="autoplay" scrolling="no" frameborder="0"></iframe>

        <!-- 5. Slot: Chat Principal & Sistema de XP Cyberpunk (Bottom-Right) -->
        <iframe id="slot-chat" class="widget-slot" src="Widget-chat/index.html" allow="autoplay" scrolling="no" frameborder="0"></iframe>

        <!-- 6. Slot: Alertas de Logros Cyberpunk Standalone (Top-Right) -->
        <iframe id="slot-logros" class="widget-slot" src="Widget-chat/Achievements-view.html" allow="autoplay" scrolling="no" frameborder="0"></iframe>

    </div>

    <!-- Script del Lienzo Unificado -->
    <script src="js/unified-canvas.js"></script>
</body>
</html>
